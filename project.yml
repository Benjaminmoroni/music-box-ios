# XcodeGen spec. The .xcodeproj is GENERATED, never committed — a pbxproj is
# unreviewable by hand and is the classic source of merge pain. CI runs
# `xcodegen generate` before xcodebuild.
name: MusicBox
options:
  bundleIdPrefix: io.github.benjaminmoroni
  deploymentTarget:
    iOS: "15.0"
targets:
  MusicBox:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources/LaunchScreen.storyboard]
    # THE KEYS LIVE HERE, NOT IN A HAND-WRITTEN Info.plist. XcodeGen GENERATES
    # the file at `path`, overwriting anything already there — so a hand-written
    # plist is silently discarded and the app ships without its entitlement.
    # The first build did exactly that: it succeeded, produced an .ipa, and
    # UIBackgroundModes was absent from the result.
    info:
      path: Resources/Info.plist
      properties:
        # The entire reason this app exists.
        UIBackgroundModes: [audio]
        # Placeholder — CI substitutes it from MB_APP_URL AFTER generating.
        MBAppURL: https://example.invalid/
        # Access one-time-PIN login redirects off our origin and back.
        MBAllowedHostSuffixes: [cloudflareaccess.com]
        CFBundleDisplayName: Music Box
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.benjaminmoroni.musicbox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
