# Builds an UNSIGNED .ipa on a hosted macOS runner.
#
# WHY THIS EXISTS: Xcode is macOS-only, but you do not need to OWN a Mac. This
# runner exists for the ten minutes of the build and is destroyed after. On a
# PUBLIC repository GitHub Actions is free, which is the whole reason this repo
# is separate from the private music-box one — the shell holds no secrets.
#
# The .ipa is deliberately UNSIGNED. AltStore signs it with a free Apple ID on
# the way onto the phone, and AltServer re-signs it before the 7-day free
# provisioning certificate lapses. No $99/yr, no Mac, no Windows.
name: build

on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Report the toolchain
        # PRINT THE VERSIONS. The first build failed because brew's XcodeGen
        # emits project format 77 and the macos-14 image ships Xcode 15.4, which
        # cannot read it — an error that says nothing about either version
        # unless you go looking. This makes the next mismatch obvious.
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Point the app at the real site
        # The repo is public, so the hostname lives in a secret rather than in
        # Info.plist. Without it the app builds and then says so on screen,
        # rather than showing a blank webview.
        env:
          MB_APP_URL: ${{ secrets.MB_APP_URL }}
        run: |
          if [ -z "$MB_APP_URL" ]; then
            echo "::warning::MB_APP_URL is not set — this build will not load anything."
          else
            /usr/libexec/PlistBuddy -c "Set :MBAppURL $MB_APP_URL" Resources/Info.plist
            echo "::notice::MBAppURL set from secret (value not printed)"
          fi

      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -project MusicBox.xcodeproj \
            -scheme MusicBox \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MusicBox.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package as an unsigned .ipa
        # An .ipa is just a zip with the .app inside Payload/. Going through
        # `xcodebuild -exportArchive` would demand signing credentials we do
        # not have and do not want.
        run: |
          mkdir -p Payload
          cp -R build/MusicBox.xcarchive/Products/Applications/MusicBox.app Payload/
          zip -qry MusicBox-unsigned.ipa Payload
          ls -lh MusicBox-unsigned.ipa

      - name: Verify the built app is not useless
        # THE FIRST BUILD "SUCCEEDED" AND SHIPPED AN APP WITH NO
        # UIBackgroundModes. XcodeGen regenerates Info.plist, so a hand-written
        # one is discarded and a substitution made before `generate` is wiped —
        # neither of which fails anything. A green build that produces an app
        # missing its only feature is worse than a red one, so assert against
        # the BUILT product rather than the source.
        run: |
          APP=build/MusicBox.xcarchive/Products/Applications/MusicBox.app/Info.plist
          modes=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP" 2>/dev/null || true)
          url=$(/usr/libexec/PlistBuddy -c "Print :MBAppURL" "$APP" 2>/dev/null || true)
          hosts=$(/usr/libexec/PlistBuddy -c "Print :MBAllowedHostSuffixes:0" "$APP" 2>/dev/null || true)
          echo "UIBackgroundModes[0] = ${modes:-<MISSING>}"
          echo "MBAllowedHostSuffixes[0] = ${hosts:-<MISSING>}"
          echo "MBAppURL is ${url:+set}${url:-<MISSING>}"   # value never printed
          fail=0
          [ "$modes" = "audio" ] || { echo "::error::UIBackgroundModes:audio is missing — the app cannot play in the background, which is the only reason it exists"; fail=1; }
          [ "$hosts" = "cloudflareaccess.com" ] || { echo "::error::MBAllowedHostSuffixes is missing — Cloudflare Access login would dead-end"; fail=1; }
          case "$url" in
            ""|*example.invalid*) echo "::error::MBAppURL was not substituted — the app has no site to load"; fail=1;;
          esac
          # THE ICON COMPILES WHETHER OR NOT IT IS USED. Without
          # ASSETCATALOG_COMPILER_APPICON_NAME the catalog builds fine and the
          # app still ships the grey placeholder — green build, no icon, which
          # is exactly how UIBackgroundModes went missing the first time.
          APPDIR=$(dirname "$APP")
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0" "$APP" 2>/dev/null || true)
          [ -f "$APPDIR/AppIcon60x60@2x.png" ] || [ -n "$icon" ] \
            || { echo "::error::no app icon in the built product — the asset catalog was compiled but not used"; fail=1; }
          echo "app icon: ${icon:-$(ls "$APPDIR" | grep -c '^AppIcon') file(s)}"
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-unsigned-ipa
          path: MusicBox-unsigned.ipa
          retention-days: 30
